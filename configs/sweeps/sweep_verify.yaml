# ─────────────────────────────────────────────────────────────
# FL-CL Sweep Verification Config (Single Fast Run)
# ─────────────────────────────────────────────────────────────
experiment:
  name: "FCL-Sweep-Verification"
  description: "Fast single-combination integration test of hyperparameter sweep controller, parent-child linking, and dataset lineage"

sweep:
  parameters:
    simulation.duration: [5]
    simulation.attack_engine: ["auto"]
    fl.rounds: [1]
    model.type: ["cnn"]
    cl.strategy: ["EWC"]
    cl.ewc_lambda: [0.8]
    training.lr: [0.003]
    training.batch_size: [32]
    security.aggregation_strategy: ["TrimmedMean"]
