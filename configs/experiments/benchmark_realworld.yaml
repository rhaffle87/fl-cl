experiment_name: "FL-CL-Benchmark-RealWorld"

experiment:
  name: "FL-CL-Benchmark-RealWorld"
  description: "Category 4: Realistic Adversarial / Poisoned & Privacy Testbed Tier"
fl:
  rounds: 10
  min_clients: 2
  fraction_fit: 0.5
  fraction_evaluate: 1.0
cl:
  strategy: EWC
  ewc_lambda: 2.0
  gem_patterns_per_exp: 256
  gem_memory_strength: 0.5
  task_sequence: benign,ssh,slowloris,dns_exfil,botnet
  complexity_score: 1.4
  comm_overhead_budget: 200000000
security:
  poison_enabled: true
  poison_client_ids:
  - A
  poison_rate: 0.2
  poison_from_class: 0
  poison_to_class: 4
  dp_enabled: true
  dp_noise_multiplier: 0.15
  dp_max_grad_norm: 1.0
  aggregation_strategy: TrimmedMean
  trimmed_mean_beta: 0.1
model:
  type: cnn
  prune_fraction: 0.2
  input_dim: 32
  num_classes: 5
  hidden_layers:
  - 64
  - 32
  dropout: 0.2
training:
  optimizer: SGD
  lr: 0.002
  momentum: 0.9
  batch_size: 64
  epochs_per_round: 3
  class_weights:
  - 1.0
  - 15.0
  - 2.0
  - 4.0
  - 15.0
features:
  columns:
  - bidirectional_packets
  - bidirectional_bytes
  - duration_ms
  - src2dst_packets
  - src2dst_bytes
  - dst2src_packets
  - dst2src_bytes
  - src2dst_mean_piat_ms
  - dst2src_mean_piat_ms
  - dst_port
simulation:
  attack_duration_seconds: 90
  stages:
  - mode: benign
  - mode: ssh
  - mode: slowloris
  - mode: dns_exfil
  - mode: botnet
topology:
  aggregator: 10.10.130.10
  defender_a: 10.10.130.11
  defender_b: 10.10.130.12
  target_a: 10.10.110.15
  target_b: 10.10.120.15
  traffic_gen: 10.10.140.10
  flower_port: 8080
  mlflow_port: 5000
notifications:
  telegram:
    enabled: false
checkpointing:
  save_dir: /opt/mlflow-artifacts/checkpoints
  save_best: true
  export_torchscript: true
mlops:
  mode: experimental
  production_strategy: "fresh"
  registered_model_name: CyberDefenseNet
labeling:
  dos_duration_threshold_ms: 2000
data_quality:
  jsd_threshold: 0.6
  gate_action: alert
  baseline_stats_path: configs/baseline_feature_stats.json
  baseline_class_distribution: 2000,10,200,50,100
