# ── FL-CL Experiment: benchmark_dropout.yaml ─────────────────────────────
# 50% Random Defender Node Disconnection / Client Dropout Stress Scenario
# Tests system resilience against node dropouts and network partitions.
# ──────────────────────────────────────────────────────────────────────────

experiment_name: "FL-CL-Benchmark-NodeDropout"

# ── Environment & Infrastructure ────────────────────────────
topology:
  aggregator: "10.10.130.10"
  defender_nodes:
    - "10.10.130.11"
    - "10.10.130.12"
  target_nodes:
    - "10.10.110.15"
    - "10.10.120.15"
  traffic_gen: "10.10.140.10"

# ── Simulation & Workload ───────────────────────────────────
simulation:
  duration_seconds: 60
  threat_stage_duration: 60
  attack_modes: ["benign", "ssh", "slowloris", "dns_exfil", "botnet"]

# ── Federated & Continual Learning ──────────────────────────
fl_cl:
  rounds: 10
  min_fit_clients: 1        # Allow FL rounds to proceed even if 50% of clients drop out
  min_evaluate_clients: 1
  min_available_clients: 1
  sample_fraction_fit: 0.5   # 50% client selection per round
  cl_strategy: "EWC"
  ewc_lambda: 2.0
  gem_patterns: 256
  gem_memory_strength: 0.5

# ── Model Architecture ──────────────────────────────────────
model:
  type: "cnn"
  prune_fraction: 0.2
  input_dim: 32
  num_classes: 5
  hidden_layers: [64, 32]
  dropout: 0.2

# ── Training Hyperparameters ────────────────────────────────
training:
  optimizer: "SGD"
  lr: 0.005
  momentum: 0.9
  batch_size: 32
  epochs_per_round: 1
  class_weights: [1.0, 15.0, 2.0, 4.0, 15.0]

# ── Security, Privacy & Defense ─────────────────────────────
security:
  aggregation_strategy: "TrimmedMean"
  trimmed_mean_beta: 0.1
  dp_enabled: false

# ── MLOps & Tracking ────────────────────────────────────────
mlops:
  mode: "experimental"
  production_strategy: "fresh"
  mlflow_port: 5000

notifications:
  telegram:
    enabled: true

checkpointing:
  save_dir: "/opt/mlflow-artifacts/checkpoints"
