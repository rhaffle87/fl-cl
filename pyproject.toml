[tool.black]
line-length = 88
target-version = ['py310']
include = '\.pyi?$'

[tool.isort]
profile = "black"
line_length = 88

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501", "E402", "E741", "F841", "E731"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pyright]
extraPaths = ["src", "src/defender", "src/aggregator", "tools"]
